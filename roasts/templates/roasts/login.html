{% extends "roasts/base.html" %}
{% block title %}Login -  Roasting Station: One{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in (local)</h1>
  {% if form.errors %}<p class="error">Invalid credentials.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
  <p class="hint">You can also <a href="{% url 'oidc_authentication_init' %}">sign in via SSO</a> once OIDC is configured.</p>
</div>
{% endblock %}
